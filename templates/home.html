<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
 
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
 
        .login {
            background: #ffffff;
            width: 100%;
            max-width: 750px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
 
        .main-title {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 2rem;
        }
 
        legend {
            text-align: center;
            color: #667eea;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
        }
 
        .mb-3 {
            margin-bottom: 18px;
        }
 
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
 
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }
 
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }
 
        select.form-control {
            cursor: pointer;
        }
 
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }
 
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
 
        .result {
            margin-top: 25px;
            text-align: center;
            color: #28a745;
            font-size: 1.5rem;
            font-weight: bold;
        }
 
        fieldset {
            border: none;
        }
 
        @media (max-width: 768px) {
            .login {
                padding: 25px;
            }
 
            .main-title {
                font-size: 1.5rem;
            }
 
            legend {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
 
<body>
 
    <div class="login">
 
        <h1 class="main-title">Student Exam Performance Indicator</h1>
 
        <form action ="{{ url_for('predict_datapoint') }}" method="post">
 
            <fieldset>
 
                <legend>Student Exam Performance Prediction</legend>
 
                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-control" name="gender" required>
                        <option selected disabled value="">Select your Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Race or Ethnicity</label>
                    <select class="form-control" name="ethnicity" required>
                        <option selected disabled value="">Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Parental Level of Education</label>
                    <select class="form-control" name="parental_level_of_education" required>
                        <option selected disabled value="">Select Parent Education</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Lunch Type</label>
                    <select class="form-control" name="lunch" required>
                        <option selected disabled value="">Select Lunch Type</option>
                        <option value="free/reduced">Free/Reduced</option>
                        <option value="standard">Standard</option>
                    </select>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Test Preparation Course</label>
                    <select class="form-control" name="test_preparation_course" required>
                        <option selected disabled value="">Select Test Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Reading Score out of 100</label>
                    <input class="form-control" type="number" name="reading_score"
                        placeholder="Enter Reading Score" min="0" max="100" required>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Writing Score out of 100</label>
                    <input class="form-control" type="number" name="writing_score"
                        placeholder="Enter Writing Score" min="0" max="100" required>
                </div>
 
                <div class="mb-3">
                    <input class="btn" type="submit" value="Predict Your Maths Score">
                </div>
 
            </fieldset>
 
        </form>
 
        {% if results %}
        <h2 class="result">
            Predicted Maths Score: {{ results }}
        </h2>
        {% endif %}
 
    </div>
 
</body>
 
</html>
